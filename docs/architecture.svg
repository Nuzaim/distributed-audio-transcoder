<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><title>Distributed audio transcoder architecture</title><defs><style>text{font-family:DejaVu Sans,sans-serif;fill:#334155;font-size:16px}.name{font-size:22px;font-weight:700}.white{fill:white}.edge{fill:none;stroke-width:2.5;stroke-linejoin:round}.caption{font-size:14px;text-anchor:middle}</style><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2563eb"/></marker><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0f766e"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker></defs><rect width="1600" height="940" fill="#f8fafc"/><text x="72" y="75" style="font-size:32px;font-weight:700">Distributed audio transcoder</text><text x="72" y="109">Upload audio, process jobs asynchronously, and publish HLS output</text><rect x="48" y="148" width="1504" height="710" rx="24" fill="white" stroke="#e2e8f0"/><path d="M282 375H420" class="edge" stroke="#64748b" marker-end="url(#g)"/><path d="M720 375H860" class="edge" stroke="#2563eb" marker-end="url(#b)"/><path d="M1120 375H1260" class="edge" stroke="#0f766e" marker-end="url(#t)"/><path d="M1390 280V210H570V280" class="edge" stroke="#64748b" marker-end="url(#g)"/><path d="M520 490V660" class="edge" stroke="#2563eb" marker-end="url(#b)"/><path d="M620 660V490" class="edge" stroke="#64748b" marker-end="url(#g)" stroke-dasharray="6 6"/><path d="M700 490V565H950V660" class="edge" stroke="#2563eb" marker-end="url(#b)"/><path d="M1100 660V560H1330V490" class="edge" stroke="#0f766e" marker-end="url(#t)"/><path d="M1430 490V730H1180" class="edge" stroke="#0f766e" marker-end="url(#t)"/><rect x="287" y="327" width="130" height="30" rx="7" fill="#f8fafc"/><text x="352" y="348" class="caption">Upload / status</text><rect x="735" y="327" width="110" height="30" rx="7" fill="#f8fafc"/><text x="790" y="348" class="caption">Enqueue job</text><rect x="1125" y="327" width="130" height="30" rx="7" fill="#f8fafc"/><text x="1190" y="348" class="caption">Receive job</text><rect x="860" y="192" width="260" height="30" rx="7" fill="#f8fafc"/><text x="990" y="213" class="caption">Report completion to API</text><rect x="758" y="547" width="160" height="30" rx="7" fill="#f8fafc"/><text x="838" y="568" class="caption">Upload source</text><rect x="1131" y="542" width="170" height="30" rx="7" fill="#f8fafc"/><text x="1216" y="563" class="caption">Download source</text><text x="505" y="575" text-anchor="end">Write job</text><text x="635" y="612">Read status</text><text x="1450" y="625">Upload</text><text x="1450" y="649">HLS</text><rect x="82" y="305" width="200" height="140" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/><rect x="160" y="327" width="44" height="30" rx="6" fill="none" stroke="#64748b" stroke-width="2"/><path d="M171 338H193M171 347H189" stroke="#64748b" stroke-width="2"/><text x="182" y="393" text-anchor="middle" class="name">Client</text><text x="182" y="422" text-anchor="middle">HTTP + WebSocket</text><rect x="420" y="280" width="300" height="210" rx="18" fill="#2563eb" stroke="#2563eb"/><text x="444" y="324" class="name white">API service</text><text x="444" y="353" class="white">Uploads and job status</text><path d="M444 375H696" stroke="white" opacity=".3"/><text x="444" y="408" class="white">Accept audio uploads</text><text x="444" y="436" class="white">Persist job metadata</text><text x="444" y="464" class="white">Stream status changes</text><rect x="860" y="295" width="260" height="160" rx="18" fill="#eef2ff" stroke="#cbd5e1"/><rect x="968" y="317" width="44" height="30" rx="6" fill="none" stroke="#64748b" stroke-width="2"/><path d="M979 328H1001M979 337H997" stroke="#64748b" stroke-width="2"/><text x="990" y="383" text-anchor="middle" class="name">Message queue</text><text x="990" y="412" text-anchor="middle">Buffer pending jobs</text><text x="990" y="435" text-anchor="middle">Dead-letter queue</text><rect x="1260" y="280" width="260" height="210" rx="18" fill="#0f766e" stroke="#0f766e"/><text x="1284" y="324" class="name white">Transcoder worker</text><text x="1284" y="353" class="white">Background processing</text><path d="M1284 375H1496" stroke="white" opacity=".3"/><text x="1284" y="408" class="white">Consume queued jobs</text><text x="1284" y="436" class="white">4 concurrent workers</text><text x="1284" y="464" class="white">ffmpeg → HLS segments</text><rect x="430" y="660" width="280" height="160" rx="18" fill="#eff6ff" stroke="#cbd5e1"/><rect x="548" y="682" width="44" height="30" rx="6" fill="none" stroke="#64748b" stroke-width="2"/><path d="M559 693H581M559 702H577" stroke="#64748b" stroke-width="2"/><text x="570" y="748" text-anchor="middle" class="name">Database</text><text x="570" y="777" text-anchor="middle">Job metadata and lifecycle</text><rect x="900" y="660" width="280" height="160" rx="18" fill="#fffbeb" stroke="#cbd5e1"/><rect x="1018" y="682" width="44" height="30" rx="6" fill="none" stroke="#64748b" stroke-width="2"/><path d="M1029 693H1051M1029 702H1047" stroke="#64748b" stroke-width="2"/><text x="1040" y="748" text-anchor="middle" class="name">Object storage</text><text x="1040" y="777" text-anchor="middle">Source audio and HLS output</text><circle cx="85" cy="905" r="5" fill="#2563eb"/><text x="101" y="911">API operations</text><circle cx="300" cy="905" r="5" fill="#0f766e"/><text x="316" y="911">Worker operations</text><path d="M543 905H578" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><text x="590" y="911">Status reads</text><text x="1528" y="911" text-anchor="end">Current development architecture</text></svg>
